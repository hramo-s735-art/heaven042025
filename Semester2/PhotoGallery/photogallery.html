<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Photo Gallery</title>
    <style>
      body {
        background-color: teal;
      }
      h1 {
        text-align: center;
        font-family:
          "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
          "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
      }
      .gallery {
        background-color: lightseagreen;
        border: 4px solid black;
        width: 90%;
        max-width: 1280px;
        margin: auto;
        display: flex;
        flex-wrap: wrap;
        border-radius: 15px;
      }
      figure {
        background-color: white;
        width: 100%;
        max-width: 250px;
        padding: 1rem;
        margin: auto;
        border-radius: 20px;
        display: block;
      }
      figcaption {
        text-align: center;
        color: #333;
        padding: 0.5rem;
        font-family:
          "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
          "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
      }
      img {
        width: 100%;
        aspect-ratio: 1/1;
        border-radius: 15px;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <h1>Flexbox Photo Gallery</h1>
    <div class="gallery">
      <figure>
        <img
          src="https://picsum.photos/300/300/?random=1"
          alt="Random Picsum Image"
        />
        <figcaption>Pinkie Pie</figcaption>
      </figure>
      <figure>
        <img
          src="https://picsum.photos/300/300/?random=2"
          alt="Random Picsum Image"
        />
        <figcaption>Rainbow Dash</figcaption>
      </figure>
      <figure>
        <img
          src="https://picsum.photos/300/300/?random=3"
          alt="Random Picsum Image"
        />
        <figcaption>Twilight Sparkle</figcaption>
      </figure>
      <figure>
        <img
          src="https://picsum.photos/300/300/?random=4"
          alt="Random Picsum Image"
        />
        <figcaption>AppleJack</figcaption>
      </figure>
      <figure>
        <img
          src="https://picsum.photos/300/300/?random=5"
          alt="Random Picsum Image"
        />
        <figcaption>Rarity</figcaption>
      </figure>
      <figure>
        <img
          src="https://picsum.photos/300/300/?random=6"
          alt="Random Picsum Image"
        />
        <figcaption>Fluttershy</figcaption>
      </figure>
      <figure>
        <img
          src="https://picsum.photos/300/300/?random=7"
          alt="Random Picsum Image"
        />
        <figcaption>Celestia</figcaption>
      </figure>
      <figure>
        <img
          src="https://picsum.photos/300/300/?random=8"
          alt="Random Picsum Image"
        />
        <figcaption>Luna</figcaption>
      </figure>
      <figure>
        <img
          src="https://picsum.photos/300/300/?random=9"
          alt="Random Picsum Image"
        />
        <figcaption>Cadance</figcaption>
      </figure>
      <figure>
        <img
          src="https://picsum.photos/300/300/?random=10"
          alt="Random Picsum Image"
        />
        <figcaption>Flurryheart</figcaption>
      </figure>
    </div>
  </body>
</html>
