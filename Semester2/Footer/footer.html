<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Footer</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      /* Mobile First Design */
      body {
        background-color: rgb(32, 178, 146);
        color: rgb(148, 255, 194);
        line-height: 1.7;
        margin: 0;
      }
      h1 {
        padding: 1rem;
        text-align: center;
        color: rgb(41, 207, 171);
      }
      #pagefooter {
        border-top: 1px solid silver;
        background-color: rgb(77, 132, 114);
        padding: 1rem;
        text-align: center;
        display: flex;
      }
      #pagefooter > p {
        /* border: 1px solid silver; */
        padding: 1rem;
      }
      #pagefooter > article {
        /* border: 1px solid silver; */
        padding: 1rem;
      }
      i {
        color: turquoise;
        font-size: 1.2rem;
        margin-left: 0.3rem;
        margin-right: 0.3rem;
      }
      i.fa-paw {
        transform: rotate(45deg);
      }
      @media screen and (min-width: 700px) {
        body {
          background-color: lightcyan;
        }
        #pagefooter {
          flex-direction: row;
          justify-content: space-between;
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <h1>Footer</h1>
    <footer id="pagefooter">
      <p>
        <i class="fa-solid fa-paw"></i>Paws & Whiskers <br />
        Made with love <i class="fa-solid fa-heart"></i> for fury friends
      </p>
      <article>
        <i class="fa-solid fa-phone"></i>559-935-7520 <br />
        <i class="fa-solid fa-envelope"></i>info@pawsandwhiskers.com<br />
        <i class="fa-solid fa-location-dot"></i>750 Van Ness St., Coaligna, CA
        93210
      </article>
    </footer>
  </body>
</html>
